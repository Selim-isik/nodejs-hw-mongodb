tags:
  - Contacts
summary: Yeni kişi ekle
operationId: createContact
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - phoneNumber
        properties:
          name:
            type: string
          phoneNumber:
            type: string
          email:
            type: string
          isFavourite:
            type: boolean
          contactType:
            type: string
            enum: [work, home, personal]
responses:
  '201':
    description: Kişi oluşturuldu
